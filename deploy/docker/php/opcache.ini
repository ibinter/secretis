[opcache]
; ============================================================================
; OpCache — Configuration production SECRETIS ERP
; ============================================================================
; Appliqué via : COPY deploy/docker/php/opcache.ini /usr/local/etc/php/conf.d/
;
; Objectif : zéro recompilation PHP à chaud en production.
; Le flag validate_timestamps=0 est critique : toute mise à jour du code
; DOIT être suivie d'un `docker exec php kill -USR2 1` (ou redémarrage).
; ============================================================================

opcache.enable                 = 1
opcache.enable_cli             = 0

; Mémoire allouée aux bytecodes compilés (MB)
; 256 MB couvre ~20 000 fichiers Laravel + dependencies
opcache.memory_consumption     = 256

; Buffer pour les strings internes (noms de fonctions, classes, keys)
opcache.interned_strings_buffer = 16

; Nombre maximal de fichiers mis en cache
; `find vendor -name "*.php" | wc -l` → ajuster si dépasse 20 000
opcache.max_accelerated_files  = 20000

; Pourcentage de mémoire gaspillée autorisé avant nettoyage automatique
opcache.max_wasted_percentage  = 10

; PRODUCTION — ne jamais vérifier les timestamps sur le disque
; Désactiver = ~30 % de gain sur les requêtes courtes
opcache.validate_timestamps    = 0
opcache.revalidate_freq        = 0

; Libération rapide de la mémoire en fin de requête
opcache.fast_shutdown          = 1

; Désactivé : inclure des fichiers sans vérification d'existence (risqué)
opcache.enable_file_override   = 0

; Niveau d'optimisation maximal (tous les passes activées)
opcache.optimization_level     = 0x7FFFBFFF

; Huge pages — améliore les performances TLB si le noyau les supporte
; Activer seulement si `cat /proc/meminfo | grep -i huge` retourne des pages
opcache.huge_code_pages        = 1

; Préchargement des classes critiques au démarrage du processus FPM
; Le script est exécuté une seule fois par worker FPM au démarrage
opcache.preload                = /var/www/html/bootstrap/preload.php
opcache.preload_user           = www-data

; Limite mémoire pour le préchargement (doit être < memory_consumption)
; opcache.preload_memory         = 64
