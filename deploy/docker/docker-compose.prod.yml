version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: secretis_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Config nginx non versionnée : voir deploy/nginx/LISEZ-MOI.md.
      - ${NGINX_CONF:-/etc/nginx/sites-enabled/secretis}:/etc/nginx/conf.d/secretis.conf:ro
      - ../../backend/public:/var/www/html/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - secretis_net

  app:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.app
      target: production
    container_name: secretis_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_HOST: postgres
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      REVERB_HOST: reverb
    volumes:
      - app_storage:/var/www/html/storage
      - ../../backend:/var/www/html:ro
      - app_storage:/var/www/html/storage:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secretis_net
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3

  queue:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.app
      target: production
    container_name: secretis_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - app
    networks:
      - secretis_net

  scheduler:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.app
      target: production
    container_name: secretis_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - app
    networks:
      - secretis_net

  reverb:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.app
      target: production
    container_name: secretis_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_PORT: 8080
    depends_on:
      - app
    networks:
      - secretis_net

  postgres:
    image: postgres:15-alpine
    container_name: secretis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups/postgres:/backups
    networks:
      - secretis_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secretis_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - secretis_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: alpine:3.18
    container_name: secretis_backup
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: 30
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    volumes:
      - ./backups:/backups
      - app_storage:/app_storage:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    command: sh -c "crond -f -d 8"
    networks:
      - secretis_net

networks:
  secretis_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_storage:
