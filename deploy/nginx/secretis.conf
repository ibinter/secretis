# =============================================================================
# SECRETIS ERP - Configuration Nginx Production
# Domaine : secretis.ibigsoft.com
# Auteur   : IBIG SOFT
# Version  : 1.0.0
# =============================================================================

# ─── Limite de taux pour les webhooks ────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=60r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m  rate=5r/m;

# ─── Cache des connexions upstream PHP-FPM ───────────────────────────────────
upstream php_fpm {
    server unix:/var/run/php/php8.2-fpm.sock;
    keepalive 32;
}

# ─── Upstream Reverb WebSocket ────────────────────────────────────────────────
upstream reverb_ws {
    server 127.0.0.1:8080;
    keepalive 64;
}

# ─── Redirection HTTP → HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name secretis.ibigsoft.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Serveur HTTPS principal ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name secretis.ibigsoft.com;

    root /var/www/secretis/backend/public;
    index index.php;

    # ── Certificats SSL Let's Encrypt ────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/secretis.ibigsoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secretis.ibigsoft.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/secretis.ibigsoft.com/chain.pem;

    # ── Paramètres SSL modernes ───────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── En-têtes de sécurité ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy (adapter selon vos CDN/scripts tiers)
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        connect-src 'self' wss://secretis.ibigsoft.com https://api.groq.com https://api.openai.com;
        frame-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
    " always;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/secretis.access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/secretis.error.log warn;

    # ── Limites upload ────────────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ── Compression Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Cache assets statiques (1 an) ─────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf|mp4|webm|ogg|mp3|wav|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # ── Favicon & robots ──────────────────────────────────────────────────────
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ── WebSocket Reverb (proxy vers port 8080) ───────────────────────────────
    location /app/ {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # Point d'entrée Reverb HTTP (stats, health)
    location /reverb/ {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Webhooks entrants (rate limiting strict) ──────────────────────────────
    location ~ ^/webhooks/ {
        limit_req zone=webhook_limit burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;

        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";   # Mitigation HTTPoxy

        fastcgi_read_timeout 30s;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 30s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Routes API (rate limiting modéré) ─────────────────────────────────────
    location ~ ^/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;

        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Route login (protection brute-force) ─────────────────────────────────
    location ~ ^/(login|password/reset) {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;

        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
    }

    # ── Point d'entrée principal Laravel ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";   # Mitigation HTTPoxy

        fastcgi_read_timeout 300s;     # timeout pour exports longs
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 120s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # Cacher les erreurs PHP en production
        fastcgi_intercept_errors off;
    }

    # ── Bloquer l'accès aux fichiers sensibles ────────────────────────────────
    location ~ /\.(ht|env|git) {
        deny all;
        return 404;
    }

    location ~ \.(sql|log|sh|bak|swp)$ {
        deny all;
        return 404;
    }

    # ── Page d'erreur personnalisée ───────────────────────────────────────────
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/secretis/backend/public;
        internal;
    }
}
