; =============================================================================
; SECRETIS ERP - Supervisor : Laravel Reverb WebSocket Server
; Port     : 8080 (proxied via Nginx depuis 443/WSS)
; Installation : sudo cp reverb.conf /etc/supervisor/conf.d/
;                sudo supervisorctl reread && sudo supervisorctl update
; Auteur   : IBIG SOFT
; Version  : 1.0.0
; =============================================================================

[program:secretis-reverb]
; Démarrage du serveur Reverb WebSocket sur le port 8080
; Nginx proxifie les connexions WSS vers ce port en interne
command=/usr/bin/php8.2 /var/www/secretis/backend/artisan reverb:start \
    --host=127.0.0.1 \
    --port=8080 \
    --debug

; Répertoire de l'application
directory=/var/www/secretis/backend

; Utilisateur système (ne pas lancer en root)
user=secretis
group=secretis

; Un seul processus Reverb (il gère plusieurs connexions en asynchrone)
numprocs=1

; Démarrage automatique avec Supervisor
autostart=true
autorestart=true

; Nombre de tentatives de redémarrage en cas d'échec
startretries=5

; Délai minimum de fonctionnement avant de considérer le démarrage comme réussi
startsecs=5

; Délai d'arrêt propre (Reverb ferme les connexions WebSocket proprement)
stopwaitsecs=30
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

; Logs Reverb dédiés
stdout_logfile=/var/log/secretis/reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/secretis/reverb-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Variables d'environnement spécifiques à Reverb
environment=
    APP_ENV="production",
    REVERB_HOST="127.0.0.1",
    REVERB_PORT="8080",
    REVERB_SCHEME="http"

; Priorité de démarrage (Reverb démarre avant les workers)
priority=100
