; =============================================================================
; SECRETIS ERP - Supervisor : Laravel Queue Workers
; Installation : sudo cp this.conf /etc/supervisor/conf.d/
;                sudo supervisorctl reread && sudo supervisorctl update
; Auteur       : IBIG SOFT
; Version      : 1.0.0
; =============================================================================

; ─── Programme principal : 3 workers en parallèle ────────────────────────────
[program:secretis-worker]
; Commande d'exécution du worker
; Priorité des queues : default > emails > broadcasts > exports
command=/usr/bin/php8.2 /var/www/secretis/backend/artisan queue:work pgsql \
    --queue=default,emails,broadcasts,exports \
    --sleep=3 \
    --tries=3 \
    --max-time=3600 \
    --memory=256 \
    --timeout=300

; Répertoire de travail
directory=/var/www/secretis/backend

; Utilisateur système
user=secretis
group=secretis

; Nombre de processus worker en parallèle
numprocs=3

; Démarrage automatique
autostart=true
autorestart=true

; Délai avant restart en cas d'échec (secondes)
startretries=3
startsecs=3

; Délai d'attente pour l'arrêt propre des jobs longs (exports PDF)
stopwaitsecs=300
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

; Logs
stdout_logfile=/var/log/secretis/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/secretis/worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Variables d'environnement
environment=
    APP_ENV="production",
    PHP_CLI_SERVER_WORKERS="3"

; Priorité de démarrage (plus bas = démarre en premier)
priority=900

; ─── Groupe pour contrôle simplifié ──────────────────────────────────────────
[group:secretis-workers]
programs=secretis-worker
priority=999


; =============================================================================
; WORKER DÉDIÉ pour la queue "exports" (jobs longs, priorité basse)
; Ce worker gère les exports PDF, Excel, etc. (timeout 600s)
; =============================================================================
[program:secretis-worker-exports]
command=/usr/bin/php8.2 /var/www/secretis/backend/artisan queue:work pgsql \
    --queue=exports \
    --sleep=5 \
    --tries=2 \
    --max-time=7200 \
    --memory=512 \
    --timeout=600

directory=/var/www/secretis/backend
user=secretis
group=secretis

numprocs=1

autostart=true
autorestart=true
startretries=3
startsecs=3

; Timeout long pour les exports (10 minutes)
stopwaitsecs=600
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/secretis/worker-exports.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/secretis/worker-exports-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

environment=
    APP_ENV="production",
    QUEUE_MEMORY_LIMIT="512"

priority=910


; =============================================================================
; WORKER DÉDIÉ pour la queue "emails" (haute priorité)
; Traitement rapide des emails transactionnels et notifications
; =============================================================================
[program:secretis-worker-emails]
command=/usr/bin/php8.2 /var/www/secretis/backend/artisan queue:work pgsql \
    --queue=emails \
    --sleep=1 \
    --tries=5 \
    --max-time=3600 \
    --memory=128 \
    --timeout=60

directory=/var/www/secretis/backend
user=secretis
group=secretis

numprocs=2

autostart=true
autorestart=true
startretries=3
startsecs=3

stopwaitsecs=120
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/secretis/worker-emails.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/secretis/worker-emails-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

environment=
    APP_ENV="production"

priority=800
