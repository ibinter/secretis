# =============================================================================
# SECRETIS ERP — Grafana : Source de données Prometheus (auto-provisionnée)
# =============================================================================
apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       http://prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      httpMethod:          POST
      timeInterval:        30s
      queryTimeout:        60s
      incrementalQuerying: true
