version: "3.9"

# =============================================================================
# SECRETIS ERP — Docker Compose On-Premise
# Éditeur : IBIG Soft  |  https://ibigsoft.com
# =============================================================================

x-app-env: &app-env
  env_file: .env

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
  secretis_storage:
  secretis_logs:
  nginx_certs:

services:

  # ---------------------------------------------------------------------------
  # Application Laravel (PHP-FPM)
  # ---------------------------------------------------------------------------
  app:
    image: ibigsoft/secretis:latest
    <<: [*restart, *logging]
    env_file: .env
    volumes:
      - secretis_storage:/var/www/html/storage/app
      - secretis_logs:/var/www/html/storage/logs
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Nginx — Reverse Proxy + Terminaison TLS
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    <<: [*restart, *logging]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
      - secretis_storage:/var/www/html/storage/app:ro
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-secretis}
      POSTGRES_USER: ${DB_USERNAME:-secretis}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-secretis} -d ${DB_DATABASE:-secretis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 7 Alpine — Cache + Queue + Sessions
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Laravel Reverb — WebSocket Server
  # ---------------------------------------------------------------------------
  reverb:
    image: ibigsoft/secretis:latest
    <<: [*restart, *logging]
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - secretis_logs:/var/www/html/storage/logs
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Queue Worker
  # ---------------------------------------------------------------------------
  queue-worker:
    image: ibigsoft/secretis:latest
    <<: [*restart, *logging]
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256
    env_file: .env
    volumes:
      - secretis_storage:/var/www/html/storage/app
      - secretis_logs:/var/www/html/storage/logs
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:monitor redis --max=100 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # Scheduler (cron Laravel)
  # ---------------------------------------------------------------------------
  scheduler:
    image: ibigsoft/secretis:latest
    <<: [*restart, *logging]
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    env_file: .env
    volumes:
      - secretis_storage:/var/www/html/storage/app
      - secretis_logs:/var/www/html/storage/logs
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list | grep -q 'Scheduled' || exit 0"]
      interval: 120s
      timeout: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # MinIO — Stockage objet compatible S3
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    <<: [*restart, *logging]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-secretis-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${APP_URL}/minio-console
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MinIO Init — Crée les buckets et politiques
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    <<: *logging
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-secretis-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_USERNAME:-secretis-app}
      MINIO_APP_PASSWORD: ${MINIO_PASSWORD}
    networks:
      - backend
    restart: "no"
