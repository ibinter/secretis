name: CI — Lint, Sécurité, Tests, E2E, Lighthouse

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Variables d'environnement globales ─────────────────────────────────────────
env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'
  POSTGRES_DB: secretis_test
  POSTGRES_USER: secretis
  POSTGRES_PASSWORD: secret

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — LINT (PHP CS Fixer + ESLint + Prettier)
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  lint:
    name: Lint (PHP + JS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: php-cs-fixer

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: PHP — Install dependencies (no-dev)
        run: cd backend && composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: PHP CS Fixer — vérification style
        run: cd backend && ./vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.php
        continue-on-error: false

      - name: PHP — analyse statique PHPStan
        run: cd backend && ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress
        continue-on-error: true

      - name: Node — Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Prettier — vérification format
        run: cd frontend && npm run format:check

      - name: TypeScript — type check
        run: cd frontend && npm run type-check

# ══════════════════════════════════════════════════════════════════════════════
# JOB 2 — SÉCURITÉ (audit dépendances + secretis:security-audit)
# ══════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Audit
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, redis, gd, bcmath, pcntl

      - name: Install PHP dependencies
        run: cd backend && composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit — vulnérabilités CVE
        run: cd backend && composer audit --no-dev

      - name: Copy .env.testing
        run: cd backend && cp .env.testing .env

      - name: Generate app key
        run: cd backend && php artisan key:generate

      - name: Migrate
        run: cd backend && php artisan migrate --force

      - name: SECRETIS security-audit — aucune vulnérabilité critique
        run: |
          cd backend
          php artisan secretis:security-audit --json > /tmp/security-audit.json
          cat /tmp/security-audit.json
          CRITICAL=$(jq '.critical | length' /tmp/security-audit.json)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "ECHEC : $CRITICAL vulnérabilité(s) critique(s) détectée(s)."
            exit 1
          fi
          echo "OK : aucune vulnérabilité critique."

      - name: NPM audit — frontend
        run: cd frontend && npm audit --audit-level=high

      - name: TruffleHog — détection de secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Upload rapport security-audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: /tmp/security-audit.json
          retention-days: 30

# ══════════════════════════════════════════════════════════════════════════════
# JOB 3 — TESTS UNITAIRES (Pest Unit, coverage ≥ 70%)
# ══════════════════════════════════════════════════════════════════════════════
  tests-unit:
    name: Tests Unitaires (Pest Unit)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, redis, gd, bcmath, pcntl
          coverage: xdebug

      - name: Install PHP dependencies
        run: cd backend && composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env.testing
        run: cd backend && cp .env.testing .env

      - name: Generate app key
        run: cd backend && php artisan key:generate

      - name: Migrate
        run: cd backend && php artisan migrate --force

      - name: Seed data (RolesAndPermissions)
        run: cd backend && php artisan db:seed --class=RolesAndPermissionsSeeder

      - name: Run Pest Unit tests avec coverage
        run: |
          cd backend && ./vendor/bin/pest \
            --testsuite=Unit \
            --coverage \
            --coverage-clover coverage-unit.xml \
            --min=70 \
            --reporter=junit \
            --log-junit test-results-unit.xml

      - name: Upload coverage Unit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: backend/coverage-unit.xml
          retention-days: 14

      - name: Upload test results Unit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: backend/test-results-unit.xml
          retention-days: 14

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage-unit.xml
          flags: unit
          name: pest-unit

# ══════════════════════════════════════════════════════════════════════════════
# JOB 4 — TESTS FEATURE (Pest Feature, coverage ≥ 65%)
# ══════════════════════════════════════════════════════════════════════════════
  tests-feature:
    name: Tests Feature (Pest Feature)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, redis, gd, bcmath, pcntl
          coverage: xdebug

      - name: Install PHP dependencies
        run: cd backend && composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env.testing
        run: cd backend && cp .env.testing .env

      - name: Generate app key
        run: cd backend && php artisan key:generate

      - name: Migrate
        run: cd backend && php artisan migrate --force

      - name: Seed data
        run: cd backend && php artisan db:seed --class=E2ESeeder

      - name: Run Pest Feature tests avec coverage
        run: |
          cd backend && ./vendor/bin/pest \
            --testsuite=Feature \
            --coverage \
            --coverage-clover coverage-feature.xml \
            --min=65 \
            --reporter=junit \
            --log-junit test-results-feature.xml

      - name: Upload coverage Feature
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-feature
          path: backend/coverage-feature.xml
          retention-days: 14

      - name: Upload test results Feature
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-feature
          path: backend/test-results-feature.xml
          retention-days: 14

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage-feature.xml
          flags: feature
          name: pest-feature

# ══════════════════════════════════════════════════════════════════════════════
# JOB 5 — PLAYWRIGHT RECETTE (Flux complets par rôle)
# ══════════════════════════════════════════════════════════════════════════════
  playwright-recette:
    name: Playwright — Recette (flux rôles)
    runs-on: ubuntu-22.04
    needs: [tests-feature]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, redis, gd, bcmath, pcntl

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install PHP dependencies
        run: cd backend && composer install --no-interaction --prefer-dist --no-progress

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Prepare backend
        run: |
          cd backend
          cp .env.testing .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=E2ESeeder

      - name: Start backend server
        run: cd backend && php artisan serve --host=0.0.0.0 --port=8000 &

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright recette tests
        run: |
          cd frontend && npx playwright test \
            --project=recette \
            --reporter=junit,html \
            --output=playwright-results/recette

      - name: Upload Playwright report (recette)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-recette
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright results (recette)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-recette
          path: frontend/playwright-results/
          retention-days: 14

# ══════════════════════════════════════════════════════════════════════════════
