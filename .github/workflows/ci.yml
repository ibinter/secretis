name: CI — Tests, Sécurité, Lint

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (Pest PHP)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: secretis_test
          POSTGRES_USER: secretis
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, redis, gd, bcmath, pcntl
          coverage: xdebug
      - name: Install dependencies
        run: cd backend && composer install --no-interaction --prefer-dist
      - name: Copy .env.testing
        run: cd backend && cp .env.testing .env
      - name: Generate key
        run: cd backend && php artisan key:generate
      - name: Run migrations
        run: cd backend && php artisan migrate --force
      - name: Seed test data
        run: cd backend && php artisan db:seed --class=E2ESeeder
      - name: Run Pest tests
        run: cd backend && ./vendor/bin/pest --coverage --coverage-clover coverage.xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: PHP Security Checker
        run: |
          cd backend
          composer require --dev roave/security-advisories:dev-latest --no-update
          composer audit
      - name: NPM Audit
        run: cd frontend && npm audit --audit-level=high
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-22.04
    needs: [backend-tests, frontend-lint]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: secretis_e2e
          POSTGRES_USER: secretis
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'pdo, pdo_pgsql, redis, gd, bcmath, pcntl' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd backend && composer install --no-interaction
      - run: cd frontend && npm ci && npm run build
      - run: cd backend && cp .env.testing .env && php artisan key:generate
      - run: cd backend && php artisan migrate --force && php artisan db:seed --class=E2ESeeder
      - run: cd backend && php artisan serve --host=0.0.0.0 --port=8000 &
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test --reporter=junit
      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
