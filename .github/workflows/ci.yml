# ══════════════════════════════════════════════════════════════════════════════
# JOB 8 — LIGHTHOUSE (Performance — 5 pages principales)
# ══════════════════════════════════════════════════════════════════════════════
  lighthouse:
    name: Lighthouse CI — Performance
    runs-on: ubuntu-22.04
    needs: [playwright-recette]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend (production)
        run: cd frontend && npm run build

      - name: Install LHCI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          cd frontend
          lhci autorun \
            --collect.url=http://localhost:4173/login \
            --collect.url=http://localhost:4173/dashboard \
            --collect.url=http://localhost:4173/agenda \
            --collect.url=http://localhost:4173/ged \
            --collect.url=http://localhost:4173/aide \
            --collect.numberOfRuns=3 \
            --assert.assertions.categories:performance=["warn",{"minScore":0.7}] \
            --assert.assertions.categories:accessibility=["error",{"minScore":0.85}] \
            --assert.assertions.categories:best-practices=["warn",{"minScore":0.8}] \
            --assert.assertions.categories:seo=["warn",{"minScore":0.8}] \
            --upload.target=temporary-public-storage
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci/
          retention-days: 14

# ══════════════════════════════════════════════════════════════════════════════
# JOB 9 — BUILD DOCKER (si tous les tests passent)
# ══════════════════════════════════════════════════════════════════════════════
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    needs: [lint, security, tests-unit, tests-feature]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.app
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

# ══════════════════════════════════════════════════════════════════════════════
# JOB 10 — DEPLOY STAGING (auto si build réussit sur develop)
# ══════════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    needs: [build-docker]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.secretis.ibigsoft.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            echo "=== Déploiement Staging — $(date) ==="
            cd /opt/secretis-staging

            # Pull de la nouvelle image
            docker pull ghcr.io/${{ github.repository }}/app:develop

            # Déploiement rolling (zéro downtime)
            docker compose -f deploy/docker/docker-compose.staging.yml up -d --no-deps app

            # Migrations
            docker compose -f deploy/docker/docker-compose.staging.yml exec -T app \
              php artisan migrate --force

            # Cache warmup
            docker compose -f deploy/docker/docker-compose.staging.yml exec -T app \
              php artisan secretis:cache:warmup

            # Caches Laravel
            docker compose -f deploy/docker/docker-compose.staging.yml exec -T app \
              php artisan config:cache
            docker compose -f deploy/docker/docker-compose.staging.yml exec -T app \
              php artisan route:cache
            docker compose -f deploy/docker/docker-compose.staging.yml exec -T app \
              php artisan view:cache

            # Redémarrage queue workers
            docker compose -f deploy/docker/docker-compose.staging.yml exec -T app \
              php artisan queue:restart

            echo "=== Déploiement terminé ==="

      - name: Health check staging
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.secretis.ibigsoft.com/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check ECHOUE : HTTP $STATUS"
            exit 1
          fi
          echo "Health check OK : HTTP $STATUS"

      - name: Notify Slack — staging déployé
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            :rocket: *Staging déployé* — SECRETIS ERP
            Branch : `develop` | Commit : `${{ github.sha }}`
            Tests : Unit ✅ Feature ✅ Security ✅
            URL : https://staging.secretis.ibigsoft.com
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
