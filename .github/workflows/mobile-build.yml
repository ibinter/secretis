name: Mobile Build & Submit

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform (ios / android / all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      submit:
        description: 'Soumettre aux stores après le build ?'
        required: true
        default: true
        type: boolean

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

# ─────────────────────────────────────────────────────────────
# Job : Validation préalable
# ─────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Validate & Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app-version.outputs.version }}
      build-number: ${{ steps.app-version.outputs.build-number }}
      version-code: ${{ steps.app-version.outputs.version-code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Read app version from app.json
        id: app-version
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_NUMBER=$(node -p "require('./app.json').expo.ios.buildNumber || '1'")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode || 1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build-number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "App version: $VERSION | iOS buildNumber: $BUILD_NUMBER | Android versionCode: $VERSION_CODE"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate EAS configuration
        working-directory: mobile
        run: eas config --platform all --profile ${{ inputs.profile || 'production' }}

# ─────────────────────────────────────────────────────────────
# Job : Build iOS
# ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    needs: validate
    if: >
      inputs.platform == 'ios' || inputs.platform == 'all' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (EAS)
        id: build
        working-directory: mobile
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          BUILD_OUTPUT=$(eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            --json \
            2>&1)
          echo "$BUILD_OUTPUT"
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[] | select(.platform == "IOS") | .id' 2>/dev/null || echo "")
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ needs.validate.outputs.version }}
          path: /tmp/eas-build-ios.log
          if-no-files-found: ignore
          retention-days: 30

# ─────────────────────────────────────────────────────────────
# Job : Build Android
# ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: validate
    if: >
      inputs.platform == 'android' || inputs.platform == 'all' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS)
        id: build
        working-directory: mobile
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --json \
            2>&1)
          echo "$BUILD_OUTPUT"
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[] | select(.platform == "ANDROID") | .id' 2>/dev/null || echo "")
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ needs.validate.outputs.version }}
          path: /tmp/eas-build-android.log
          if-no-files-found: ignore
          retention-days: 30

# ─────────────────────────────────────────────────────────────
# Job : Submit iOS vers App Store Connect
# ─────────────────────────────────────────────────────────────
  submit-ios:
    name: Submit iOS to App Store
    runs-on: ubuntu-latest
    needs: [validate, build-ios]
    if: >
      (inputs.submit != false) &&
      (inputs.profile == 'production' || startsWith(github.ref, 'refs/tags/'))
    environment:
      name: app-store
      url: https://appstoreconnect.apple.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit iOS to App Store Connect
        working-directory: mobile
        env:
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "IBIG SECRETIS v${{ needs.validate.outputs.version }} soumis a l'App Store avec succes ! En attente de la revision Apple."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

# ─────────────────────────────────────────────────────────────
# Job : Submit Android vers Google Play Store
# ─────────────────────────────────────────────────────────────
  submit-android:
    name: Submit Android to Google Play
    runs-on: ubuntu-latest
    needs: [validate, build-android]
    if: >
      (inputs.submit != false) &&
      (inputs.profile == 'production' || startsWith(github.ref, 'refs/tags/'))
    environment:
      name: google-play
      url: https://play.google.com/console
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Google Play service account key
        working-directory: mobile
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > google-services-key.json

      - name: Submit Android to Google Play
        working-directory: mobile
        run: |
          eas submit \
            --platform android \
            --profile production \
            --latest \
            --non-interactive

      - name: Remove service account key
        if: always()
        working-directory: mobile
        run: rm -f google-services-key.json

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "IBIG SECRETIS v${{ needs.validate.outputs.version }} soumis au Google Play Store ! Rollout initial : 10%."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

# ─────────────────────────────────────────────────────────────
# Job : Rapport final
# ─────────────────────────────────────────────────────────────
  report:
    name: Build Report
    runs-on: ubuntu-latest
    needs: [validate, build-ios, build-android, submit-ios, submit-android]
    if: always()
    steps:
      - name: Generate build summary
        run: |
          echo "## IBIG SECRETIS Mobile Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS buildNumber | ${{ needs.validate.outputs.build-number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android versionCode | ${{ needs.validate.outputs.version-code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Profile | ${{ inputs.profile || 'production' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | ${{ github.ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build iOS | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Submit iOS | ${{ needs.submit-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Submit Android | ${{ needs.submit-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Liens utiles" >> $GITHUB_STEP_SUMMARY
          echo "- [EAS Dashboard](https://expo.dev/accounts/ibigsoft/projects/ibig-secretis)" >> $GITHUB_STEP_SUMMARY
          echo "- [App Store Connect](https://appstoreconnect.apple.com)" >> $GITHUB_STEP_SUMMARY
          echo "- [Google Play Console](https://play.google.com/console)" >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────
# Secrets requis dans GitHub Settings > Secrets > Actions :
#
#   EXPO_TOKEN                    — Token EAS (expo.dev > Access tokens)
#   APPLE_ID                      — Apple ID (ex: dev@ibigsoft.com)
#   APPLE_APP_SPECIFIC_PASSWORD   — Mot de passe spécifique à l'app (appleid.apple.com)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON — Contenu du fichier JSON du compte de service GCP
#   SLACK_WEBHOOK_URL             — (optionnel) Webhook Slack pour les notifications
# ─────────────────────────────────────────────────────────────
