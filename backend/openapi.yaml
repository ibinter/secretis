openapi: 3.1.0

info:
  title: IBIG SECRETIS ERP API
  version: 1.0.0
  description: |
    API REST officielle de **IBIG SECRETIS ERP** — plateforme de gestion d'entreprise multi-tenant.

    ## Authentification
    Toutes les routes protégées utilisent un **Bearer token Sanctum**.
    Obtenez votre token via `POST /auth/login`, puis incluez-le dans chaque requête :
    ```
    Authorization: Bearer <votre_token>
    ```

    ## Multi-tenant
    Chaque organisation dispose de son propre sous-domaine :
    `https://{slug}.secretis.ibigsoft.com/api/v1`

    ## Rate Limiting
    - Endpoints publics : **60 req/min**
    - Endpoints authentifiés : **1000 req/heure**
    - Login : **5 tentatives/min** par email+IP

    ## Format des réponses
    Toutes les réponses sont en JSON avec la structure suivante :
    ```json
    {
      "success": true,
      "data": { ... },
      "message": "...",
      "meta": { "page": 1, "per_page": 25, "total": 100 }
    }
    ```

    ## Codes d'erreur
    | Code | Signification |
    |------|---------------|
    | 400  | Requête invalide |
    | 401  | Non authentifié |
    | 403  | Non autorisé (permission manquante) |
    | 404  | Ressource introuvable |
    | 422  | Erreur de validation |
    | 429  | Trop de requêtes |
    | 500  | Erreur serveur |

  contact:
    name: Support IBIG SECRETIS
    email: support@ibigsoft.com
    url: https://secretis.ibigsoft.com
  license:
    name: Proprietary
    url: https://secretis.ibigsoft.com/legal/api-terms

servers:
  - url: https://{subdomain}.secretis.ibigsoft.com/api/v1
    description: Production
    variables:
      subdomain:
        default: demo
        description: Slug de votre organisation
  - url: https://sandbox.secretis.ibigsoft.com/api/v1
    description: Sandbox (tests)

security:
  - BearerAuth: []

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token Sanctum obtenu via POST /auth/login

  # ---------------------------------------------------------------------------
  # SCHEMAS — Modèles
  # ---------------------------------------------------------------------------
  schemas:

    # ---- Meta / Pagination --------------------------------------------------
    Meta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page:     { type: integer, example: 25 }
        total:        { type: integer, example: 142 }
        last_page:    { type: integer, example: 6 }
        from:         { type: integer, example: 1 }
        to:           { type: integer, example: 25 }

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:    {}

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Non autorisé" }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            meta: { $ref: '#/components/schemas/Meta' }

    # ---- Organization -------------------------------------------------------
    Organization:
      type: object
      properties:
        id:          { type: string, format: uuid, example: "01j8vz..." }
        name:        { type: string, example: "Société ACME CI" }
        slug:        { type: string, example: "acme-ci" }
        email:       { type: string, format: email }
        country:     { type: string, example: "CI" }
        timezone:    { type: string, example: "Africa/Abidjan" }
        status:      { type: string, enum: [active, trial, grace, suspended, expired] }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        logo_url:    { type: string, nullable: true }
        settings:
          type: object
          properties:
            language:         { type: string, example: "fr" }
            enabled_modules:  { type: array, items: { type: string } }
        created_at:  { type: string, format: date-time }

    # ---- User ---------------------------------------------------------------
    User:
      type: object
      properties:
        id:              { type: integer, example: 42 }
        organization_id: { type: string, format: uuid }
        name:            { type: string, example: "Konan Amani" }
        email:           { type: string, format: email }
        avatar_url:      { type: string, nullable: true }
        status:          { type: string, enum: [active, inactive, locked] }
        roles:
          type: array
          items: { type: string }
          example: ["admin_org"]
        department:      { $ref: '#/components/schemas/Department', nullable: true }
        last_login_at:   { type: string, format: date-time, nullable: true }
        created_at:      { type: string, format: date-time }

    Department:
      type: object
      properties:
        id:   { type: string, format: uuid }
        name: { type: string, example: "Direction Générale" }
        code: { type: string, example: "DG" }

    # ---- Event --------------------------------------------------------------
    Event:
      type: object
      properties:
        id:             { type: string, format: uuid }
        calendar_id:    { type: string, format: uuid }
        creator_id:     { type: integer }
        title:          { type: string, example: "Réunion de direction" }
        description:    { type: string, nullable: true }
        location:       { type: string, nullable: true }
        start_at:       { type: string, format: date-time, example: "2026-07-21T09:00:00Z" }
        end_at:         { type: string, format: date-time, example: "2026-07-21T10:30:00Z" }
        is_all_day:     { type: boolean, example: false }
        recurrence_rule: { type: string, nullable: true, example: "FREQ=WEEKLY;BYDAY=MO,WE,FR" }
        color:          { type: string, nullable: true, example: "#3B82F6" }
        type:           { type: string, enum: [event, meeting, task, reminder] }
        meet_link:      { type: string, nullable: true }
        reminders:
          type: array
          items:
            type: object
            properties:
              minutes:  { type: integer }
              channel:  { type: string, enum: [email, push, sms] }
        participants:
          type: array
          items:
            type: object
            properties:
              user_id: { type: integer }
              name:    { type: string }
              status:  { type: string, enum: [pending, accepted, declined] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventCalendarFormat:
      type: object
      description: Format FullCalendar.js
      properties:
        id:     { type: string, format: uuid }
        title:  { type: string }
        start:  { type: string, example: "2026-07-21T09:00:00+00:00" }
        end:    { type: string, example: "2026-07-21T10:30:00+00:00" }
        allDay: { type: boolean }
        color:  { type: string }
        extendedProps:
          type: object
          properties:
            type:             { type: string }
            description:      { type: string }
            location:         { type: string }
            meet_link:        { type: string }
            recurrence_rule:  { type: string }
            calendar_id:      { type: string }
            creator_name:     { type: string }
            participants_count: { type: integer }
            has_room:         { type: boolean }

    # ---- Task ---------------------------------------------------------------
    Task:
      type: object
      properties:
        id:          { type: string, format: uuid }
        project_id:  { type: string, format: uuid, nullable: true }
        parent_id:   { type: string, format: uuid, nullable: true }
        title:       { type: string, example: "Préparer le rapport Q3" }
        description: { type: string, nullable: true }
        status:      { type: string, enum: [todo, in_progress, review, done, cancelled] }
        priority:    { type: string, enum: [low, normal, high, urgent] }
        due_date:    { type: string, format: date, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        position:    { type: integer }
        is_overdue:  { type: boolean }
        assignees:
          type: array
          items: { $ref: '#/components/schemas/User' }
        subtasks_count:    { type: integer }
        subtasks_progress: { type: integer, description: "Pourcentage de complétion des sous-tâches" }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    # ---- MailRegistry -------------------------------------------------------
    MailRegistry:
      type: object
      properties:
        id:           { type: string, format: uuid }
        type:         { type: string, enum: [incoming, outgoing] }
        reference:    { type: string, example: "REF-ENTRANT-2026-00042" }
        sender_name:  { type: string, nullable: true }
        sender_org:   { type: string, nullable: true }
        recipient_name: { type: string, nullable: true }
        recipient_org:  { type: string, nullable: true }
        subject:      { type: string, example: "Demande de partenariat" }
        urgency:      { type: string, enum: [low, normal, high, urgent] }
        received_at:  { type: string, format: date-time, nullable: true }
        sent_at:      { type: string, format: date-time, nullable: true }
        status:       { type: string, enum: [pending, processing, processed, archived] }
        notes:        { type: string, nullable: true }
        assignee:     { $ref: '#/components/schemas/User', nullable: true }
        attachments:
          type: array
          items:
            type: object
            properties:
              id:   { type: string }
              name: { type: string }
              size: { type: integer }
              mime: { type: string }
              url:  { type: string }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    # ---- Document -----------------------------------------------------------
    Document:
      type: object
      properties:
        id:          { type: string, format: uuid }
        folder_id:   { type: string, format: uuid, nullable: true }
        name:        { type: string, example: "Rapport_Annuel_2025.pdf" }
        original_name: { type: string }
        mime_type:   { type: string, example: "application/pdf" }
        size:        { type: integer, description: "Taille en octets" }
        version:     { type: integer, example: 1 }
        uploader:    { $ref: '#/components/schemas/User' }
        download_url: { type: string }
        shared_with:
          type: array
          items: { $ref: '#/components/schemas/User' }
        created_at:  { type: string, format: date-time }

    # ---- Meeting ------------------------------------------------------------
    Meeting:
      type: object
      properties:
        id:           { type: string, format: uuid }
        title:        { type: string, example: "Conseil d'administration T3" }
        description:  { type: string, nullable: true }
        location:     { type: string, nullable: true }
        meet_link:    { type: string, nullable: true }
        starts_at:    { type: string, format: date-time }
        ends_at:      { type: string, format: date-time }
        status:       { type: string, enum: [scheduled, in_progress, done, cancelled] }
        organizer:    { $ref: '#/components/schemas/User' }
        participants:
          type: array
          items:
            type: object
            properties:
              user:   { $ref: '#/components/schemas/User' }
              status: { type: string, enum: [pending, accepted, declined] }
        minutes:      { type: string, nullable: true, description: "Compte rendu HTML" }
        decisions:
          type: array
          items:
            type: object
            properties:
              id:      { type: string }
              content: { type: string }
              task_id: { type: string, nullable: true }
        created_at:   { type: string, format: date-time }

    # ---- Visitor ------------------------------------------------------------
    Visitor:
      type: object
      properties:
        id:           { type: string, format: uuid }
        full_name:    { type: string, example: "Kouamé Jean-Baptiste" }
        company:      { type: string, nullable: true }
        phone:        { type: string, nullable: true }
        email:        { type: string, nullable: true }
        id_number:    { type: string, nullable: true }
        purpose:      { type: string, example: "Réunion commerciale" }
        host:         { $ref: '#/components/schemas/User' }
        badge_number: { type: string, nullable: true }
        checked_in_at:  { type: string, format: date-time }
        checked_out_at: { type: string, format: date-time, nullable: true }
        status:       { type: string, enum: [checked_in, checked_out, no_show] }
        photo_url:    { type: string, nullable: true }

    # ---- Invoice ------------------------------------------------------------
    Invoice:
      type: object
      properties:
        id:           { type: string, format: uuid }
        number:       { type: string, example: "FACT-2026-00042" }
        client_name:  { type: string }
        client_email: { type: string }
        client_address: { type: string, nullable: true }
        issue_date:   { type: string, format: date }
        due_date:     { type: string, format: date }
        status:       { type: string, enum: [draft, sent, paid, overdue, cancelled] }
        currency:     { type: string, example: "XOF" }
        subtotal:     { type: number, format: float }
        tax_rate:     { type: number, example: 18.0 }
        tax_amount:   { type: number }
        total:        { type: number }
        paid_amount:  { type: number }
        balance:      { type: number }
        items:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              quantity:    { type: number }
              unit_price:  { type: number }
              total:       { type: number }
        notes:        { type: string, nullable: true }
        payment_gateway: { type: string, nullable: true, enum: [cinetpay, paystack, flutterwave] }
        pdf_url:      { type: string, nullable: true }
        created_at:   { type: string, format: date-time }

    # ---- Notification -------------------------------------------------------
    Notification:
      type: object
      properties:
        id:         { type: string, format: uuid }
        type:       { type: string, example: "task_assigned" }
        title:      { type: string, example: "Nouvelle tâche assignée" }
        body:       { type: string }
        data:
          type: object
          additionalProperties: true
        is_read:    { type: boolean }
        read_at:    { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

  # ---------------------------------------------------------------------------
  # PARAMETERS
  # ---------------------------------------------------------------------------
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, default: 25, maximum: 100 }
    SearchParam:
      name: search
      in: query
      schema: { type: string }
      description: Recherche plein texte

  # ---------------------------------------------------------------------------
  # RESPONSES
  # ---------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Unauthenticated."

    Forbidden:
      description: Permission insuffisante
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Cette action n'est pas autorisée."

    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Ressource introuvable."

    ValidationError:
      description: Erreur de validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Les données fournies sont invalides."
            errors:
              email: ["Le champ email est obligatoire."]

    TooManyRequests:
      description: Trop de requêtes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Trop de tentatives. Réessayez dans 60 secondes."

# =============================================================================
# PATHS
# =============================================================================
paths:

  # ===========================================================================
  # AUTH
  # ===========================================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion utilisateur
      description: |
        Authentifie un utilisateur et retourne un token Sanctum.
        Rate-limité à 5 tentatives par email+IP par minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email, example: "admin@acme-ci.com" }
                password: { type: string, format: password, example: "MonMotDePasse@2026" }
                remember: { type: boolean, default: false }
            example:
              email: "admin@acme-ci.com"
              password: "MonMotDePasse@2026"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:        { type: string, example: "1|abc123xyz..." }
                          token_type:   { type: string, example: "Bearer" }
                          user:         { $ref: '#/components/schemas/User' }
                          organization: { $ref: '#/components/schemas/Organization' }
              example:
                success: true
                message: "Connexion réussie."
                data:
                  token: "1|LkZt8Mhq3rPxQwYvNjDcAbUiOs7Ef2Gy"
                  token_type: "Bearer"
                  user:
                    id: 42
                    name: "Konan Amani"
                    email: "admin@acme-ci.com"
                    roles: ["admin_org"]
                  organization:
                    id: "01j8vz..."
                    name: "Société ACME CI"
                    slug: "acme-ci"
                    status: "active"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      description: Invalide le token Sanctum courant.
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              example:
                success: true
                message: "Déconnexion réussie."
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rafraîchir le token
      description: Révoque le token actuel et en émet un nouveau.
      responses:
        '200':
          description: Nouveau token émis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:      { type: string }
                          token_type: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Utilisateur courant
      description: Retourne le profil de l'utilisateur authentifié.
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:         { $ref: '#/components/schemas/User' }
                          organization: { $ref: '#/components/schemas/Organization' }
                          permissions:  { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===========================================================================
  # AGENDA
  # ===========================================================================
  /events:
    get:
      tags: [Agenda]
      summary: Lister les événements
      description: Retourne les événements dans une plage de dates au format FullCalendar.
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-07-01" }
          description: Début de la plage
        - name: end
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-07-31" }
          description: Fin de la plage
        - name: view
          in: query
          schema: { type: string, enum: [month, week, day, list], default: "month" }
        - name: calendar_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string, enum: [event, meeting, task, reminder] }
      responses:
        '200':
          description: Liste des événements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EventCalendarFormat' }
              example:
                success: true
                data:
                  - id: "01j8ab..."
                    title: "Réunion de direction"
                    start: "2026-07-21T09:00:00+00:00"
                    end: "2026-07-21T10:30:00+00:00"
                    allDay: false
                    color: "#8B5CF6"
                    extendedProps:
                      type: "meeting"
                      location: "Salle A"
                      participants_count: 5
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Agenda]
      summary: Créer un événement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start_at, end_at]
              properties:
                calendar_id:     { type: string, format: uuid }
                title:           { type: string, example: "Réunion commerciale" }
                description:     { type: string }
                location:        { type: string }
                start_at:        { type: string, format: date-time, example: "2026-07-25T10:00:00Z" }
                end_at:          { type: string, format: date-time, example: "2026-07-25T11:00:00Z" }
                is_all_day:      { type: boolean, default: false }
                recurrence_rule: { type: string, example: "FREQ=WEEKLY;BYDAY=MO" }
                color:           { type: string, example: "#3B82F6" }
                type:            { type: string, enum: [event, meeting, task, reminder], default: "event" }
                meet_link:       { type: string }
                participant_ids: { type: array, items: { type: integer } }
                reminders:
                  type: array
                  items:
                    type: object
                    properties:
                      minutes: { type: integer }
                      channel: { type: string, enum: [email, push] }
      responses:
        '201':
          description: Événement créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Event' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Agenda]
      summary: Détail d'un événement
      responses:
        '200':
          description: Détail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Agenda]
      summary: Modifier un événement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:       { type: string }
                start_at:    { type: string, format: date-time }
                end_at:      { type: string, format: date-time }
                description: { type: string }
                location:    { type: string }
                color:       { type: string }
      responses:
        '200':
          description: Événement modifié
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Agenda]
      summary: Supprimer un événement
      responses:
        '200':
          description: Événement supprimé
          content:
            application/json:
              example: { success: true, message: "Événement supprimé." }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # COURRIER
  # ===========================================================================
  /mail-registry:
    get:
      tags: [Courrier]
      summary: Lister le registre courrier
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, processing, processed, archived] }
        - name: type
          in: query
          schema: { type: string, enum: [incoming, outgoing] }
        - { $ref: '#/components/parameters/SearchParam' }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
        - name: urgency
          in: query
          schema: { type: string, enum: [low, normal, high, urgent] }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MailRegistry' }
              example:
                success: true
                data:
                  - id: "01j8cd..."
                    type: "incoming"
                    reference: "REF-ENTRANT-2026-00042"
                    subject: "Demande de partenariat"
                    urgency: "high"
                    status: "pending"
                    sender_name: "Touré Ibrahim"
                    received_at: "2026-07-20T08:30:00Z"
                meta:
                  current_page: 1
                  per_page: 25
                  total: 142

    post:
      tags: [Courrier]
      summary: Enregistrer un courrier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, subject]
              properties:
                type:         { type: string, enum: [incoming, outgoing] }
                subject:      { type: string }
                sender_name:  { type: string }
                sender_org:   { type: string }
                recipient_name: { type: string }
                recipient_org:  { type: string }
                urgency:      { type: string, enum: [low, normal, high, urgent], default: "normal" }
                received_at:  { type: string, format: date-time }
                sent_at:      { type: string, format: date-time }
                notes:        { type: string }
                processing_delay_days: { type: integer, default: 3 }
      responses:
        '201':
          description: Courrier enregistré
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MailRegistry' }

  /mail-registry/{id}/assign:
    put:
      tags: [Courrier]
      summary: Assigner un courrier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:    { type: integer }
                department_id: { type: string, format: uuid }
                notes:      { type: string }
      responses:
        '200':
          description: Courrier assigné
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MailRegistry' }

  /mail-registry/{id}/status:
    put:
      tags: [Courrier]
      summary: Changer le statut d'un courrier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, processing, processed, archived] }
