  # ===========================================================================
  # TACHES
  # ===========================================================================
  /tasks:
    get:
      tags: [Tâches]
      summary: Lister les tâches
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [todo, in_progress, review, done, cancelled] }
        - name: assignee_id
          in: query
          schema: { type: integer }
        - name: priority
          in: query
          schema: { type: string, enum: [low, normal, high, urgent] }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Task' }

    post:
      tags: [Tâches]
      summary: Créer une tâche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:       { type: string, example: "Rédiger rapport annuel" }
                description: { type: string }
                project_id:  { type: string, format: uuid }
                parent_id:   { type: string, format: uuid }
                priority:    { type: string, enum: [low, normal, high, urgent], default: "normal" }
                due_date:    { type: string, format: date }
                assignee_ids: { type: array, items: { type: integer } }
            example:
              title: "Préparer la présentation Q3"
              priority: "high"
              due_date: "2026-07-30"
              assignee_ids: [5, 8]
      responses:
        '201':
          description: Tâche créée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Task' }

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    put:
      tags: [Tâches]
      summary: Modifier une tâche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:       { type: string }
                description: { type: string }
                priority:    { type: string, enum: [low, normal, high, urgent] }
                due_date:    { type: string, format: date }
                assignee_ids: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Tâche modifiée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Task' }

    delete:
      tags: [Tâches]
      summary: Supprimer une tâche
      responses:
        '200':
          description: Tâche supprimée
          content:
            application/json:
              example: { success: true, message: "Tâche supprimée." }

  /tasks/{id}/status:
    put:
      tags: [Tâches]
      summary: Changer le statut d'une tâche
      description: |
        Transitions autorisées :
        - `todo` → `in_progress`, `cancelled`
        - `in_progress` → `review`, `todo`, `cancelled`
        - `review` → `done`, `in_progress`, `cancelled`
        - `done` → `in_progress` (ré-ouverture)
        - `cancelled` → `todo` (réactivation)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [todo, in_progress, review, done, cancelled] }
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Task' }
        '422':
          description: Transition non autorisée
          content:
            application/json:
              example:
                success: false
                message: "Transition de statut non autorisée : todo → done"

