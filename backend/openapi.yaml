  # ===========================================================================
  # WEBHOOKS ENTRANTS (paiements)
  # ===========================================================================
  /webhooks/cinetpay:
    post:
      tags: [Webhooks]
      summary: Webhook CinetPay
      description: |
        Endpoint pour recevoir les notifications de paiement CinetPay.
        Vérification HMAC de la signature avant traitement.
        **Ne pas authentifier** — signature HMAC uniquement.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpm_site_id:      { type: string }
                cpm_trans_id:     { type: string }
                cpm_trans_date:   { type: string }
                cpm_amount:       { type: string }
                cpm_currency:     { type: string }
                signature:        { type: string }
                payment_method:   { type: string }
                cel_phone_num:    { type: string }
                cpm_phone_prefixe: { type: string }
                cpm_payment_config: { type: string }
                cpm_result:       { type: string }
                cpm_error_message: { type: string }
                cpm_custom:       { type: string }
      responses:
        '200':
          description: Webhook traité
          content:
            application/json:
              example: { status: "OK" }
        '400':
          description: Signature invalide
        '422':
          description: Paiement non trouvé

  /webhooks/paystack:
    post:
      tags: [Webhooks]
      summary: Webhook Paystack
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: "charge.success"
