name: Deploy — SECRETIS ERP (Production)

on:
  push:
    branches: [main]

# Interdire les déploiements parallèles — un seul à la fois sur main
concurrency:
  group: deploy-production
  cancel-in-progress: false

# =============================================================================
# Conditions : uniquement sur main ET après passage de la CI
# =============================================================================

jobs:

  # ---------------------------------------------------------------------------
  # VÉRIFICATION que la CI a réussi avant de déployer
  # ---------------------------------------------------------------------------

  check-ci:
    name: "Vérification CI préalable"
    runs-on: ubuntu-22.04
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}

    steps:
      - name: Vérifier que la CI est passée
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });

            const ciJob = checks.check_runs.find(r => r.name === 'CI réussie');
            const success = ciJob && ciJob.conclusion === 'success';

            core.setOutput('can_deploy', success ? 'true' : 'false');

            if (!success) {
              core.setFailed('La CI n\'a pas réussi. Déploiement annulé.');
            }

  # ---------------------------------------------------------------------------
  # BUILD — Prépare les artefacts de production
  # ---------------------------------------------------------------------------

  build:
    name: "Build de production"
    runs-on: ubuntu-22.04
    needs: check-ci
    if: needs.check-ci.outputs.can_deploy == 'true'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pgsql, pdo_pgsql, redis, bcmath, gd, intl, mbstring, zip
          tools: composer:v2

      - name: Installation Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Composer (production)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-prod-${{ hashFiles('**/composer.lock') }}

      - name: Installation dépendances PHP (sans dev)
        working-directory: backend
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --ansi

      - name: Installation dépendances NPM
        working-directory: frontend
        run: npm ci --silent

      - name: Build assets frontend (Vite)
        working-directory: frontend
        env:
          VITE_APP_URL: ${{ secrets.PROD_APP_URL }}
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          NODE_ENV: production
        run: npm run build

      - name: Archivage des artefacts de build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            backend/
            frontend/dist/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # DEPLOY — SSH vers le serveur de production avec rollback automatique
  # ---------------------------------------------------------------------------

  deploy:
    name: "Déploiement production"
    runs-on: ubuntu-22.04
    needs: build
    environment: production

    steps:
      - name: Checkout (pour les scripts de déploiement)
        uses: actions/checkout@v4

      - name: Configuration de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Ajout de l'empreinte du serveur (known_hosts)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Activation du mode maintenance
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "cd ${{ secrets.PROD_APP_PATH }} && php artisan down --refresh=15 --retry=60 --secret='${{ secrets.MAINTENANCE_SECRET }}'"

      - name: Pull du code sur le serveur
        id: git_pull
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.PROD_APP_PATH }}
            git fetch origin main
            git stash
            git checkout main
            git pull origin main
            echo "Pull réussi : $(git log -1 --format='%h %s')"
          ENDSSH

      - name: Installation des dépendances Composer (production)
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.PROD_APP_PATH }}
            composer install \
              --no-dev \
              --optimize-autoloader \
              --prefer-dist \
              --no-interaction \
              --no-progress
          ENDSSH

      - name: Exécution des migrations (avec rollback automatique si échec)
        id: migrate
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.PROD_APP_PATH }}

            # Sauvegarder le numéro de migration actuel pour rollback
            CURRENT_MIGRATION=$(php artisan migrate:status --json | python3 -c "
            import sys, json
            data = json.load(sys.stdin)
            ran = [m for m in data if m.get('ran')]
            print(ran[-1]['migration'] if ran else '')
            " 2>/dev/null || echo "")

            echo "Migration courante avant deploy: $CURRENT_MIGRATION"

            # Exécuter les migrations
            if ! php artisan migrate --force --no-interaction; then
              echo "MIGRATION_FAILED=true" >> /tmp/deploy_status
              exit 1
            fi

            echo "Migrations exécutées avec succès"
          ENDSSH

      - name: Rollback si migration échoue
        if: failure() && steps.migrate.outcome == 'failure'
        run: |
          echo "Migration échouée — tentative de rollback"
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.PROD_APP_PATH }}

            # Rollback de la dernière migration
            php artisan migrate:rollback --step=1 --force --no-interaction

            # Revenir au commit précédent
            git stash pop || true
            git checkout HEAD~1

            echo "Rollback effectué — retour à HEAD~1"
          ENDSSH

      - name: Déploiement des assets frontend
        run: |
          rsync -avz \
            --delete \
            --exclude='.git' \
            frontend/dist/ \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }}:${{ secrets.PROD_APP_PATH }}/public/build/

      - name: Optimisation Laravel (cache config, routes, views)
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.PROD_APP_PATH }}

            # Vider les caches d'abord
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear

            # Reconstruire les caches optimisés
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan optimize

            # Lier le storage si nécessaire
            php artisan storage:link --force

            echo "Optimisation terminée"
          ENDSSH

      - name: Redémarrage des workers de queue
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.PROD_APP_PATH }}
            php artisan queue:restart
            echo "Workers redémarrés"
          ENDSSH

      - name: Désactivation du mode maintenance
        if: always()
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "cd ${{ secrets.PROD_APP_PATH }} && php artisan up"
          echo "Application en ligne"

      - name: Vérification post-déploiement (health check)
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Health-Check: ci-deploy" \
            "${{ secrets.PROD_APP_URL }}/api/health")

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check échoué (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "Health check OK (HTTP $HTTP_STATUS)"

      - name: Notification de déploiement réussi
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.sha.substring(0, 7);
            const message = `Déploiement production réussi — commit ${commit}`;
            console.log(message);
            // Slack/Teams notification possible ici

      - name: Rollback d'urgence si health check échoue
        if: failure()
        run: |
          echo "Déploiement échoué — tentative de rollback d'urgence"
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.PROD_APP_PATH }}

            # Revenir au dernier commit stable
            git checkout HEAD~1

            # Migrations rollback
            php artisan migrate:rollback --step=1 --force --no-interaction || true

            # Réoptimiser
            php artisan optimize

            # Lever la maintenance
            php artisan up

            echo "Rollback d'urgence terminé"
          ENDSSH

# =============================================================================
# Secrets requis dans GitHub Actions → Settings → Secrets
# =============================================================================
# PROD_SSH_PRIVATE_KEY       : Clé SSH privée pour accès serveur production
# PROD_SSH_USER              : Utilisateur SSH (ex: deploy)
# PROD_SERVER_HOST           : Adresse IP ou domaine du serveur
# PROD_APP_PATH              : Chemin absolu de l'application (ex: /var/www/secretis)
# PROD_APP_URL               : URL publique (ex: https://app.secretis.ibig.ci)
# PROD_API_URL               : URL API (ex: https://api.secretis.ibig.ci)
# MAINTENANCE_SECRET         : Token secret pour bypasser la maintenance
# DB_TEST_PASSWORD           : Mot de passe PostgreSQL de test
# APP_KEY_TEST               : APP_KEY pour les tests
# CINETPAY_SECRET_KEY_TEST   : Clé secrète CinetPay (sandbox)
# CINETPAY_SITE_ID_TEST      : Site ID CinetPay (sandbox)
